<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judges — KREEN Judging</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-app" data-config-page="judges" data-master-page="judges" data-active-nav="judges">
  <div id="admin-root"></div>
  <template id="admin-page-template">
    <header class="admin-page-header">
      <div>
        <h1 class="admin-page-title">Judges</h1>
        <p class="admin-page-description">Manage judge identity, contact details, status, and round participation.</p>
      </div><button class="admin-btn admin-btn-primary" data-master-open="" type="button">+ Add Judge</button>
    </header>
    <div class="admin-filter-bar">
      <div class="admin-search-wrap">
        <span class="admin-search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="config-search">Search judges</label><input class="admin-field" id="config-search" type="search" placeholder="Search name, number, email, or phone">
      </div><label class="sr-only" for="config-status-filter">Filter judge status</label><select class="admin-field" id="config-status-filter">
        <option value="all">
          Status: All
        </option>
        <option value="active">
          Active
        </option>
        <option value="inactive">
          Inactive
        </option>
      </select>
    </div>
    <div id="config-content"></div>
  </template>
  <div class="admin-drawer-backdrop" id="admin-drawer" hidden="">
    <aside class="admin-drawer" role="dialog" aria-modal="true">
      <header class="admin-drawer-header">
        <h2 id="admin-drawer-title">Manage Judge</h2><button class="admin-icon-btn" data-close-drawer="" aria-label="Close drawer">×</button>
      </header>
      <div class="admin-drawer-body" id="admin-drawer-body"></div>
      <footer class="admin-drawer-footer" id="admin-drawer-footer"></footer>
    </aside>
  </div>
  <script src="../assets/js/session.js"></script>
  <script src="admin-navigation.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-round-workspace.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-domain.js"></script>
  <script src="admin-master.js"></script>
  <script src="admin.js"></script>
</body>
</html>
