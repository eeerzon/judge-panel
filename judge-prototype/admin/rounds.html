<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rounds — KREEN Judging</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-app" data-admin-page="rounds" data-active-nav="rounds">
  <div id="admin-root"></div>
  <template id="admin-page-template">
    <header class="admin-page-header">
      <div>
        <p class="admin-eyebrow">Event configuration</p>
        <h1 class="admin-page-title">Rounds</h1>
        <p class="admin-page-description">Operational status and configuration readiness for every judging round.</p>
      </div><button class="admin-btn admin-btn-primary" data-open-drawer="">+ Create Round</button>
    </header>
    <div id="rounds-content"></div>
  </template>
  <div class="admin-drawer-backdrop" id="admin-drawer" hidden="">
    <aside class="admin-drawer" role="dialog" aria-modal="true">
      <header class="admin-drawer-header">
        <h2 id="admin-drawer-title">Create Round</h2><button class="admin-icon-btn" data-close-drawer="">×</button>
      </header>
      <div class="admin-drawer-body">
        <p class="admin-page-description">Creation is a visual prototype only; it does not change the local mock data.</p>
      </div>
      <footer class="admin-drawer-footer">
        <button class="admin-btn" data-close-drawer="">Cancel</button><button class="admin-btn admin-btn-primary" data-close-drawer="">Create Draft</button>
      </footer>
    </aside>
  </div>
  <script src="../assets/js/session.js"></script>
  <script src="admin-navigation.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-round-workspace.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-domain.js"></script>
  <script src="admin.js"></script>
</body>
</html>
