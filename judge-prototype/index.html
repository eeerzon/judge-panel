<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — KREEN Judging</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/entry.css">
</head>
<body class="entry-body">
  <main class="entry-layout">
    <section class="entry-intro" aria-label="KREEN Judging">
      <span class="entry-mark">K</span>
      <p class="entry-kicker">KREEN JUDGING</p>
      <h1>Every score starts with clarity.</h1>
      <p>One place to manage the event and give every contestant a thoughtful, fair evaluation.</p>
      <span class="entry-event">King &amp; Queen of the Pacific · 2026</span>
    </section>
    <section class="entry-panel" aria-labelledby="login-title">
      <p class="entry-eyebrow">Welcome back</p>
      <h2 id="login-title">Sign in</h2>
      <p class="entry-help">Continue to your judging workspace.</p>
      <form id="entry-login-form">
        <label for="entry-identity">Email or username</label>
        <input id="entry-identity" name="identity" autocomplete="username" required placeholder="Your email or username">
        <label for="entry-password">Password</label>
        <input id="entry-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
        <p class="entry-note">Demo access accepts any password.</p>
        <p class="entry-error" id="entry-error" role="alert" hidden></p>
        <button class="entry-btn entry-btn-primary" type="submit">Sign In <span aria-hidden="true">→</span></button>
      </form>
      <div class="entry-demo"><p>DEMO ACCESS</p><button type="button" data-demo-user="ersa">Continue as Ersa</button><button type="button" data-demo-user="amanda">Continue as Amanda Wijaya</button><button type="button" data-demo-user="event-admin">Continue as Event Admin</button></div>
    </section>
  </main>
  <script src="assets/js/session.js"></script>
  <script src="assets/js/entry.js"></script>
</body>
</html>
